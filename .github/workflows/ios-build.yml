name: ios-build
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode configuration (Use Release for iPad 9 performance)
        required: true
        default: Release
        type: choice
        options: [Release, RelWithDebInfo, Debug]
      ref:
        description: Git ref to build
        required: false
        default: ""
        type: string

concurrency:
  group: ios-build-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  generate-spirv:
    name: Generate SPIR-V Headers
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Generate SPIR-V Headers
        shell: pwsh
        run: |
          Set-Location ${{ github.workspace }}
          ./scripts/ci/generate-spirv-headers.ps1

      - name: Upload SPIR-V Headers
        uses: actions/upload-artifact@v4
        with:
          name: spirv-headers
          path: ./.artifacts/spirv-headers
          if-no-files-found: error

  build-ios:
    name: Build iOS (iPad 9 Optimized)
    runs-on: macos-14
    needs: generate-spirv
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Install Dependencies
        run: brew install cmake ninja pkg-config

      - name: Apply iPad 9 & Controller Patches
        run: |
          # Enable File Sharing (Files App & iTunes)
          find . -name "Info.plist" -exec sed -i '' '/<dict>/a \
          <key>UIFileSharingEnabled</key><true/>\
          <key>LSSupportsOpeningDocumentsInPlace</key><true/>' {} +

          # Performance tuning for A13 Bionic (iPad 9)
          export CFLAGS="-O3 -mtune=apple-a13"
          export CXXFLAGS="-O3 -mtune=apple-a13"

      - name: Verify Local Assets
        run: |
          # Check if your files exist in the private folder
          if [[ -f ./UnleashedRecompLib/private/default.xex && -f ./UnleashedRecompLib/private/default.xexp && -f ./UnleashedRecompLib/private/shader.ar ]]; then
            echo "✅ Local game files found in UnleashedRecompLib/private/. Proceeding..."
          else
            echo "❌ ERROR: Missing files in UnleashedRecompLib/private/!"
            ls -R ./UnleashedRecompLib/private/
            exit 1
          fi

      - name: Prepare Host Tools & Recompile
        run: |
          cmake . --preset macos-release -DSDL2MIXER_VORBIS=VORBISFILE
          cmake --build ./out/build/macos-release --target XenonRecomp x_decompress XenosRecomp file_to_c --parallel $(sysctl -n hw.ncpu)
          
          pushd ./out/build/macos-release/UnleashedRecompLib
          ../tools/XenonRecomp/XenonRecomp/XenonRecomp || true
          ../tools/x_decompress/x_decompress \
            "${GITHUB_WORKSPACE}/UnleashedRecompLib/private/shader.ar" \
            "${GITHUB_WORKSPACE}/UnleashedRecompLib/private/shader_decompressed.ar"
          ../tools/XenosRecomp/XenosRecomp/XenosRecomp || true
          popd
          
          cmake --build ./out/build/macos-release --target UnleashedRecomp --parallel $(sysctl -n hw.ncpu)

      - name: Download SPIR-V Headers
        uses: actions/download-artifact@v4
        with:
          name: spirv-headers
          path: ./.artifacts/spirv-headers

      - name: Final iOS Build
        env:
          IOS_CONFIGURATION: ${{ inputs.configuration }}
        run: |
          rsync -a ./.artifacts/spirv-headers/ ./
          chmod +x ./scripts/ci/build-ios.sh
          ./scripts/ci/build-ios.sh

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unleashed-iOS-iPad9-Optimized
          path: ./out/artifacts/ios
          if-no-files-found: error
