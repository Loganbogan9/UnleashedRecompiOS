name: Portable validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: Configure portable tests
        run: >-
          cmake -S . -B out/tests -G Ninja
          -DUNLEASHED_RECOMP_PORTABLE_TESTS_ONLY=ON
          -DUNLEASHED_RECOMP_TEST_SANITIZERS=ON
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
      - name: Compile production portable components and tests
        run: cmake --build out/tests
      - name: Run tests
        run: ctest --test-dir out/tests --output-on-failure
